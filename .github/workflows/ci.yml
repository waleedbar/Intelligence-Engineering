name: CI

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sahacore_ci
          POSTGRES_PASSWORD: sahacore_ci
          POSTGRES_DB: sahacore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sahacore_ci:sahacore_ci@localhost:5432/sahacore_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The equation layers are pure functions and must stay that way: run
      # them with no database configured at all, so a hidden dependency on
      # one cannot creep in unnoticed. The ledger's tests skip here and run
      # for real further down.
      - name: Run equation-layer tests with no database configured
        env:
          DATABASE_URL: ""
        run: python -m pytest tests/ -v

      - name: Apply database migrations
        run: python -m sahacore.migrate

      - name: Re-apply migrations (must be a no-op)
        run: python -m sahacore.migrate

      - name: Load Layer 0 registries
        run: |
          python -m sahacore.data.load_nutrients
          python -m sahacore.data.load_state_vector
          python -m sahacore.data.load_layer_c_d
          python -m sahacore.data.load_layer_m
          python -m sahacore.data.load_qssa_atp
          python -m sahacore.data.load_ledger_policy
          python -m sahacore.data.load_parameter_registry
          python -m sahacore.data.load_eq_param_fk
          python -m sahacore.data.load_eq_build_rows
          python -m sahacore.data.load_veto_messages
          python -m sahacore.data.load_veto_registry
          python -m sahacore.data.load_action_space
          python -m sahacore.data.load_runtime_invariants
          python -m sahacore.data.load_param_registry_ext20
          python -m sahacore.data.load_nutrient_classes
          python -m sahacore.data.load_supplement_registry
          python -m sahacore.data.load_equation_backbone
          python -m sahacore.data.load_datamap
          python -m sahacore.data.load_core_equations
          python -m sahacore.data.load_state_admission
          python -m sahacore.data.load_organ_registries
          python -m sahacore.data.load_bistability_guard
          python -m sahacore.data.load_verification_labs
          python -m sahacore.data.load_validation_battery
          python -m sahacore.data.load_scoped_builds
          python -m sahacore.data.load_onboarding_canonical
          python -m sahacore.data.load_onboarding_o1
          python -m sahacore.data.load_onboarding_o2
          python -m sahacore.data.load_tvmcd_pathways
          python -m sahacore.data.load_onboarding_o3
          python -m sahacore.data.load_onboarding_o4
          python -m sahacore.data.load_step_questions
          python -m sahacore.data.load_onboarding_o5
          python -m sahacore.data.load_onboarding_o6
          python -m sahacore.data.load_onboarding_o7

      # Every registry gets the version a derived packet must cite, and the
      # recorder refuses to version content the loader did not actually write.
      - name: Record registry versions
        run: python -m sahacore.data.record_registry_versions

      # A reload of unchanged content must not mint a new version, or the
      # version history becomes noise and comparing two packets' versions
      # stops meaning anything.
      - name: Re-record registry versions (must create nothing new)
        run: |
          python -m sahacore.data.record_registry_versions | tee /tmp/versions.txt
          grep -q '(0 new,' /tmp/versions.txt

      - name: Verify loaded row counts match source
        run: |
          python -c "
          import os, psycopg
          conn = psycopg.connect(os.environ['DATABASE_URL'])
          with conn.cursor() as cur:
              cur.execute('SELECT count(*) FROM engine_internal.nutrients')
              n = cur.fetchone()[0]
              assert n == 81, f'expected 81 nutrients, got {n}'
              cur.execute('SELECT count(*) FROM engine_internal.state_vector')
              s = cur.fetchone()[0]
              assert s == 219, f'expected 219 state vector rows, got {s}'
              cur.execute('SELECT count(*) FROM engine_internal.cluster_scoring_params')
              c = cur.fetchone()[0]
              assert c == 12, f'expected 12 cluster scoring params, got {c}'
              cur.execute('SELECT count(*) FROM engine_internal.nutrient_cluster_weights')
              w = cur.fetchone()[0]
              assert w == 357, f'expected 357 nutrient-cluster weights, got {w}'
              cur.execute('SELECT count(*) FROM engine_internal.damage_registry_canonical')
              d = cur.fetchone()[0]
              assert d == 108, f'expected 108 damage registry rows, got {d}'
              cur.execute('SELECT count(*) FROM engine_internal.layer_m_scarring_params')
              m = cur.fetchone()[0]
              assert m == 12, f'expected 12 layer M scarring params, got {m}'
              cur.execute('SELECT count(*) FROM engine_internal.qssa_atp_complexes')
              q = cur.fetchone()[0]
              assert q == 5, f'expected 5 QSSA ATP complexes, got {q}'
              cur.execute(\"SELECT count(*) FROM engine_internal.replay_lag_policy WHERE status = 'ACTIVE'\")
              p = cur.fetchone()[0]
              assert p == 1, f'expected exactly 1 active replay lag policy, got {p}'
              cur.execute('SELECT count(*) FROM engine_internal.parameter_registry')
              r = cur.fetchone()[0]
              assert r == 192, f'expected 192 registry parameters, got {r}'
              cur.execute(\"SELECT count(*) FROM engine_internal.parameter_gaps WHERE weight = 'Critical'\")
              g = cur.fetchone()[0]
              assert g == 10, f'expected 10 critical parameter gaps, got {g}'
              cur.execute('SELECT count(*) FROM engine_internal.eq_param_fk')
              f = cur.fetchone()[0]
              assert f == 126, f'expected 126 FK rows, got {f}'
              cur.execute('SELECT count(*) FROM engine_internal.missing_fk')
              mf = cur.fetchone()[0]
              assert mf == 5, f'expected 5 missing FKs, got {mf}'
              # VETO-01, the Replay Contract's release gate: '339 rows and 339
              # unique canonical IDs; source IDs retained'. The retained source
              # ids are 319 distinct values across those 339 rows -- that gap is
              # the primary-key collision the canonical id repaired, and it must
              # stay visible rather than be deduplicated away.
              cur.execute('SELECT count(*), count(DISTINCT rule_id), count(DISTINCT source_rule_id) FROM engine_internal.veto_drug_nutrient')
              rows, ids, src = cur.fetchone()
              assert (rows, ids, src) == (339, 339, 319), f'VETO-01 failed: {(rows, ids, src)}'
              cur.execute(\"SELECT count(*) FROM engine_internal.veto_hard\")
              hard = cur.fetchone()[0]
              assert hard == 94, f'expected 94 hard vetoes, got {hard}'
              # The action ontology keeps all 127 arms; arm 127 carries the
              # sheet's own safety hold. Deliberately NOT asserting 127
              # activatable arms -- the source sheet forbids that test.
              cur.execute('SELECT count(*), count(activation_hold) FROM engine_internal.action_space')
              acts, held = cur.fetchone()
              assert (acts, held) == (127, 1), f'expected 127 actions with 1 held, got {(acts, held)}'
              cur.execute('SELECT count(*) FROM engine_internal.action_space_info')
              info = cur.fetchone()[0]
              assert info == 7, f'expected 7 information actions, got {info}'
              # Every registry a packet could cite has exactly one ACTIVE version.
              cur.execute('SELECT count(*) FROM engine_internal.registry_current')
              versioned = cur.fetchone()[0]
              assert versioned == 64, f'expected 64 versioned registries, got {versioned}'
              # The twelve per-cluster ceilings on the scarring feedback loop,
              # each confirmed by the sheet's own section-8 audit receipt.
              cur.execute('SELECT count(*) FROM engine_internal.bistability_cap')
              bc = cur.fetchone()[0]
              assert bc == 12, f'expected 12 bistability caps, got {bc}'
              # The workbook's six worked examples, with the exact Excel
              # formula stored beside every published result.
              cur.execute('SELECT role, count(*) FROM engine_internal.verification_lab_quantity GROUP BY role')
              lab_roles = dict(cur.fetchall())
              assert lab_roles == {'INPUT': 28, 'DERIVED': 23, 'VERDICT': 7}, lab_roles
              cur.execute('SELECT count(*), count(*) FILTER (WHERE weight <> 0) FROM engine_internal.cluster_coupling_gamma')
              cells, edges = cur.fetchone()
              assert (cells, edges) == (144, 19), f'candidate Gamma: {(cells, edges)}'
              # FINDING: the labs' Layer-M demo point runs at gamma*r = 2.76,
              # above the cap for eleven of the twelve clusters. Only C6
              # admits it. Reported in docs/parameter-gaps.md, not corrected.
              cur.execute('SELECT count(*) FROM engine_internal.demo_point_outside_admitted_region')
              outside = cur.fetchone()[0]
              assert outside == 11, f'expected 11 refusing clusters, got {outside}'
              # FINDING: LAB 3 calls 0.05 an operating gain where the runtime
              # invariant, parameter #138 and parameter #141 all say otherwise.
              cur.execute('SELECT count(*) FROM engine_internal.eta_net_disagreement')
              eta = cur.fetchone()[0]
              assert eta == 1, f'expected 1 eta_net disagreement, got {eta}'
              # The engine's acceptance criteria, and how many this build runs.
              # 41 BLOCKING criteria are not enforced yet; that number is the
              # build's backlog and is expected to shrink, never to be hidden.
              cur.execute('SELECT gate, coverage, count(*) FROM engine_internal.validation_test GROUP BY gate, coverage')
              battery = {(g, c): n for g, c, n in cur.fetchall()}
              assert sum(battery.values()) == 71, battery
              assert battery[('BLOCKING', 'ENFORCED')] == 6, battery
              assert battery[('BLOCKING', 'PARTIAL')] == 7, battery
              cur.execute('SELECT count(*) FROM engine_internal.blocking_tests_not_enforced')
              backlog = cur.fetchone()[0]
              assert backlog == 41, f'expected 41 unenforced BLOCKING tests, got {backlog}'
              # Layers G and H are years away, but their shared prerequisite 1
              # -- 'a per-user longitudinal record the ONLINE engine must
              # already be writing' -- is a claim about the ledger being built
              # now, and it is not met. One unmet prerequisite, not zero.
              cur.execute('SELECT count(*) FROM engine_internal.unmet_scoped_prerequisites')
              unmet = cur.fetchone()[0]
              assert unmet == 1, f'expected 1 unmet scoped prerequisite, got {unmet}'
              cur.execute('SELECT count(*) FROM engine_internal.founder_decision')
              fd = cur.fetchone()[0]
              assert fd == 8, f'expected 8 open founder decisions, got {fd}'
              # Layer 0's fourteen modules. Twelve can be written today;
              # ONB-011 and ONB-012 wait on a 15->12 pathway-to-cluster
              # bridge that five sheets name and none of them contains.
              cur.execute('SELECT count(*) FROM engine_internal.onboarding_buildable')
              ob = cur.fetchone()[0]
              assert ob == 12, f'expected 12 buildable onboarding steps, got {ob}'
              cur.execute('SELECT count(*) FROM engine_internal.onboarding_blocked')
              obl = cur.fetchone()[0]
              assert obl == 2, f'expected 2 blocked onboarding steps, got {obl}'
              # The 219 slot layout, from a second sheet, block by block.
              cur.execute('SELECT sum(last_index - first_index + 1) FROM engine_internal.onboarding_state_block')
              slots = cur.fetchone()[0]
              assert slots == 219, f'onboarding blocks cover {slots} slots, not 219'
              # ONB-001, the first module that computes. Ten equations and
              # twelve sourced parameters, every one read by
              # sahacore/onboarding/anthropometrics.py rather than copied
              # into it.
              cur.execute('SELECT count(*) FROM engine_internal.onboarding_o1_equation')
              o1e = cur.fetchone()[0]
              assert o1e == 10, f'expected 10 O1 equations, got {o1e}'
              cur.execute('SELECT count(*), count(source) FROM engine_internal.onboarding_o1_parameter')
              o1p, sourced = cur.fetchone()
              assert (o1p, sourced) == (12, 12), f'O1 parameters: {(o1p, sourced)}'
              # BSA is specified by two consolidated sheets and by no
              # equation on its own authority sheet.
              cur.execute('SELECT count(*) FROM engine_internal.onboarding_declared_elsewhere')
              de = cur.fetchone()[0]
              assert de == 1, f'expected 1 equation declared elsewhere, got {de}'
              # ONB-002. Six of eight equations implemented; O2.4 waits on
              # HR_Arem and O2.5 on rho_pop, neither of which the workbook
              # ever defines.
              cur.execute('SELECT count(*), count(*) FILTER (WHERE computable) FROM engine_internal.onboarding_o2_equation')
              o2e, o2c = cur.fetchone()
              assert (o2e, o2c) == (8, 6), f'O2 equations: {(o2e, o2c)}'
              cur.execute('SELECT count(*) FROM engine_internal.onboarding_o2_gaps')
              o2g = cur.fetchone()[0]
              assert o2g == 2, f'expected 2 O2 gaps, got {o2g}'
              cur.execute('SELECT count(*) FROM engine_internal.onboarding_o2_encoding')
              enc = cur.fetchone()[0]
              assert enc == 11, f'expected 11 O2 encodings, got {enc}'
              # The MET catalogue: 50 activities, and 6 of the 12 cluster
              # columns the sheet's own banner promises.
              cur.execute('SELECT count(*) FROM engine_internal.activity_catalogue')
              acts50 = cur.fetchone()[0]
              assert acts50 == 50, f'expected 50 activities, got {acts50}'
              cur.execute('SELECT count(*), count(DISTINCT cluster_id) FROM engine_internal.activity_cluster_impact')
              imp, clusters = cur.fetchone()
              assert (imp, clusters) == (300, 6), f'activity impacts: {(imp, clusters)}'
              cur.execute('SELECT count(*) FROM engine_internal.activity_intensity_disagreement')
              band = cur.fetchone()[0]
              assert band == 6, f'expected 6 intensity disagreements, got {band}'
              # The 15 TVMCD pathways, and the pathway->cluster map an earlier
              # commit wrongly reported as absent. Membership only: no
              # weights, and C01 is fed by nothing.
              cur.execute('SELECT count(*) FROM engine_internal.tvmcd_pathway')
              tp = cur.fetchone()[0]
              assert tp == 15, f'expected 15 TVMCD pathways, got {tp}'
              cur.execute('SELECT count(*), count(DISTINCT cluster_id) FROM engine_internal.tvmcd_cluster_output')
              links, clusters = cur.fetchone()
              assert (links, clusters) == (42, 11), f'pathway-cluster map: {(links, clusters)}'
              cur.execute('SELECT array_agg(cluster_id) FROM engine_internal.clusters_with_no_pathway')
              orphan = cur.fetchone()[0]
              assert orphan == ['C01'], f'clusters with no pathway: {orphan}'
              # ONB-003. All eight equations implemented -- the first O-sheet
              # with no symbol the workbook leaves undefined. Its four-option
              # consistency scale is read from the sheet, not retyped.
              cur.execute('SELECT count(*), count(engine_target) FROM engine_internal.onboarding_o3_equation')
              o3e, o3t = cur.fetchone()
              assert (o3e, o3t) == (8, 8), f'O3 equations: {(o3e, o3t)}'
              cur.execute('SELECT count(*) FROM engine_internal.onboarding_o3_ordinal')
              o3o = cur.fetchone()[0]
              assert o3o == 4, f'expected 4 O3 ordinal options, got {o3o}'
              # ONB-004. Ten PSS-10 items with four reverse-scored -- the
              # sheet states which twice and the extractor holds the two
              # statements to each other. Nine equations, and three bands
              # that must tile 0-40 so every total has one meaning.
              cur.execute('SELECT count(*), count(*) FILTER (WHERE reverse_scored) FROM engine_internal.onboarding_o4_item')
              o4i, o4r = cur.fetchone()
              assert (o4i, o4r) == (10, 4), f'O4 items: {(o4i, o4r)}'
              cur.execute('SELECT count(*), count(engine_target) FROM engine_internal.onboarding_o4_equation')
              o4e, o4t = cur.fetchone()
              assert (o4e, o4t) == (9, 9), f'O4 equations: {(o4e, o4t)}'
              cur.execute('SELECT count(*), min(score_min), max(score_max) FROM engine_internal.onboarding_o4_band')
              o4b, o4lo, o4hi = cur.fetchone()
              assert (o4b, o4lo, o4hi) == (3, 0, 40), f'O4 bands: {(o4b, o4lo, o4hi)}'
              # The onboarding questionnaire, manifest order 70 -- the UI
              # contract that says what every O-module is actually given.
              # Its Step 8 rows are the workbook's THIRD statement of the
              # PSS-10 reverse set, and all three agree on 4, 5, 7 and 8.
              cur.execute('SELECT count(*) FROM engine_internal.onboarding_step_question_step')
              sqs = cur.fetchone()[0]
              assert sqs == 12, f'expected 12 onboarding steps, got {sqs}'
              cur.execute('SELECT count(*), count(*) FILTER (WHERE is_choice) FROM engine_internal.onboarding_step_question')
              sqq, sqc = cur.fetchone()
              assert (sqq, sqc) == (73, 32), f'step questions: {(sqq, sqc)}'
              cur.execute(\"SELECT array_agg(variable ORDER BY variable) FROM engine_internal.onboarding_step_question WHERE reverse_scored\")
              rev = cur.fetchone()[0]
              assert rev == ['r4', 'r5', 'r7', 'r8'], f'reverse-scored PSS-10 items: {rev}'
              cur.execute('SELECT count(*) FROM engine_internal.onboarding_step_question_option')
              sqo = cur.fetchone()[0]
              assert sqo == 130, f'expected 130 answer options, got {sqo}'
              # ONB-005. Seven equations and four answer encodings. O5.5's
              # four SSB midpoints carry no labels, so option IS NULL there
              # and nowhere else -- pairing them with Step 3's bands would be
              # this build deciding which number means which answer.
              cur.execute('SELECT count(*), count(engine_target) FROM engine_internal.onboarding_o5_equation')
              o5e, o5t = cur.fetchone()
              assert (o5e, o5t) == (7, 7), f'O5 equations: {(o5e, o5t)}'
              cur.execute('SELECT count(*), count(DISTINCT encodes), count(*) FILTER (WHERE option IS NULL) FROM engine_internal.onboarding_o5_encoding')
              o5n, o5v, o5u = cur.fetchone()
              assert (o5n, o5v, o5u) == (18, 4, 4), f'O5 encodings: {(o5n, o5v, o5u)}'
              # ONB-006. Eleven equations, six relative risks -- every one
              # citing the study it came from, which no other O-sheet does
              # for any constant. Only O6.2-O6.7 state a risk; O6.1's I(FH)
              # and O6.10's I(FH_relevant) are placeholders, not indicators.
              cur.execute('SELECT count(*), count(indicator) FROM engine_internal.onboarding_o6_equation')
              o6e, o6i = cur.fetchone()
              assert (o6e, o6i) == (11, 6), f'O6 equations: {(o6e, o6i)}'
              cur.execute('SELECT count(*), count(source) FROM engine_internal.onboarding_o6_condition')
              o6c, o6s = cur.fetchone()
              assert (o6c, o6s) == (6, 6), f'O6 conditions: {(o6c, o6s)}'
              cur.execute('SELECT count(*), count(DISTINCT z_pathway) FROM engine_internal.onboarding_o6_condition_pathway')
              o6p, o6z = cur.fetchone()
              assert (o6p, o6z) == (7, 7), f'O6 pathway map: {(o6p, o6z)}'
              # ONB-007. Four equations, eight dietary patterns -- and NO
              # prior table, because O7.1 needs 8 x 81 x 2 = 1,296 numbers
              # and the workbook supplies none. Two patterns the sheet
              # itself marks absent from the UI; three UI options no
              # pattern claims by an exact label, one of which
              # (Intermittent Fasting) has no candidate at all.
              cur.execute('SELECT count(*) FROM engine_internal.onboarding_o7_equation')
              o7e = cur.fetchone()[0]
              assert o7e == 4, f'expected 4 O7 equations, got {o7e}'
              cur.execute(\"SELECT count(*), count(*) FILTER (WHERE ui_status = 'DECLARED_NOT_IN_UI') FROM engine_internal.onboarding_o7_pattern\")
              o7p, o7a = cur.fetchone()
              assert (o7p, o7a) == (8, 2), f'O7 patterns: {(o7p, o7a)}'
              cur.execute('SELECT count(*) FROM engine_internal.onboarding_o7_ui_option_unclaimed')
              o7u = cur.fetchone()[0]
              assert o7u == 3, f'expected 3 unclaimed UI diet options, got {o7u}'
              # 48 organ-pathway links over 13 pathways: none for D14/D15,
              # which is gate d14_d15_fail_closed agreeing with the data.
              cur.execute('SELECT count(*), count(DISTINCT pathway_id) FROM engine_internal.organ_pathway_weight')
              links, paths = cur.fetchone()
              assert (links, paths) == (48, 13), f'organ-pathway: {(links, paths)}'
              # The 24 message templates the VETO rules render, now a real FK.
              cur.execute('SELECT count(*) FROM engine_internal.veto_rule_message')
              vm = cur.fetchone()[0]
              assert vm == 339, f'expected all 339 rules to render a message, got {vm}'
              # One CRITICAL template refers the reader to nobody. A finding,
              # reported in docs/parameter-gaps.md, not a tolerance.
              cur.execute('SELECT count(*) FROM engine_internal.critical_message_without_referral')
              cw = cur.fetchone()[0]
              assert cw == 1, f'expected exactly 1 referral-less CRITICAL template, got {cw}'
              # The state vector may not grow: four candidates refused.
              cur.execute('SELECT count(*) FROM engine_internal.refused_state_candidates')
              rc = cur.fetchone()[0]
              assert rc == 4, f'expected 4 refused state candidates, got {rc}'
              # The corrections already applied to 19 of the 51 equations.
              cur.execute('SELECT count(*) FROM engine_internal.equation_corrections')
              ec = cur.fetchone()[0]
              assert ec == 19, f'expected 19 recorded corrections, got {ec}'
              # The DataMap's stored-vs-computed split, and the step-3 input contract.
              cur.execute('SELECT count(*) FROM engine_internal.datamap_computed')
              dc = cur.fetchone()[0]
              assert dc == 44, f'expected 44 computed variables, got {dc}'
              cur.execute('SELECT count(*) FROM engine_internal.datamap_onboarding_field')
              df = cur.fetchone()[0]
              assert df == 63, f'expected 63 onboarding fields, got {df}'
              # The 58-equation wiring map.
              cur.execute('SELECT count(*) FROM engine_internal.equation_backbone')
              eb = cur.fetchone()[0]
              assert eb == 58, f'expected 58 backbone equations, got {eb}'
              # The NULL-CAP rule: four supplements modelled at zero effect.
              cur.execute('SELECT count(*) FROM engine_internal.supplement_null_capped')
              nc = cur.fetchone()[0]
              assert nc == 4, f'expected 4 null-capped supplements, got {nc}'
              # All 81 nutrients carry the kinetic constraint that governs them.
              cur.execute('SELECT count(*) FROM engine_internal.nutrient_kinetics')
              nk = cur.fetchone()[0]
              assert nk == 81, f'expected 81 classified nutrients, got {nk}'
              # Both parameter registries: 192 numbered + 20 unnumbered.
              cur.execute('SELECT count(*) FROM engine_internal.parameter_all')
              pa = cur.fetchone()[0]
              assert pa == 212, f'expected 212 parameters in total, got {pa}'
              # The canonical invariants and their fail-closed gates.
              cur.execute('SELECT count(*), count(gate), count(enforced_by) FROM engine_internal.runtime_invariant')
              inv, gated, enforced = cur.fetchone()
              assert (inv, gated, enforced) == (23, 18, 6), f'invariants: {(inv, gated, enforced)}'
              cur.execute('SELECT count(*) FROM engine_internal.eq_build_rows')
              b = cur.fetchone()[0]
              assert b == 119, f'expected 119 build rows, got {b}'
              # The FK coverage this sheet buys, and the five rows it does not:
              # two '..' spans the workbook never enumerates and three K3-N
              # rows with no build row at all. Counted over FK rows, of which
              # 126 carry 123 distinct equation IDs.
              cur.execute('SELECT count(*) FROM engine_internal.fk_coverage WHERE NOT has_build_row')
              u = cur.fetchone()[0]
              assert u == 5, f'expected 5 FK rows without a build row, got {u}'
              # Input tokens resolve only where the registry holds the spelling
              # once, for a layer the row does not contradict. The 11 withheld
              # near-misses are pinned by (equation, token) in the test suite.
              cur.execute(\"SELECT kind, count(*) FROM engine_internal.eq_build_row_inputs GROUP BY kind\")
              kinds = dict(cur.fetchall())
              assert kinds == {'SYMBOL': 8, 'AMBIGUOUS': 3, 'OTHER_LAYER': 8, 'PROSE': 316}, kinds
          print('OK: 81 nutrients, 219 state vector rows, 12 cluster params, 357 weights, 108 damage rows, 12 layer M params, 5 QSSA ATP complexes, 1 replay lag policy, 192 parameters, 10 critical gaps, 126 FK rows, 5 missing FKs, 119 build rows, 5 uncovered FK rows, 8 resolved input tokens, VETO-01 pass (339/339/319), 94 hard vetoes, 127 actions (1 held), 7 info actions, 12 bistability caps, 6 verification labs, 71 battery tests (6 enforced/7 partial/41 blocking-open), 8 open founder decisions, Layer 0 contract 12 buildable/2 blocked, ONB-001 live (10 eq/12 params), ONB-002 live (6 of 8 eq), 50 activities (6 of 12 cluster cols), 15 TVMCD pathways, ONB-003 live (8 of 8 eq), ONB-004 live (9 eq/10 PSS-10 items/3 bands), 12 onboarding steps (73 questions), ONB-005 live (7 eq/18 encoded answers), ONB-006 live (11 eq/6 sourced risks), ONB-007 partial (4 eq/8 patterns, 1296 priors absent), 64 versioned registries')
          "

      # Step 1's acceptance tests -- "duplicate event no-op; late event
      # replay" -- are database behaviour, so they run against the real
      # Postgres service rather than a mock.
      - name: Run the full suite against PostgreSQL (ledger acceptance tests)
        run: python -m pytest tests/ -v
