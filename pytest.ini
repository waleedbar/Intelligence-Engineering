[pytest]
# `tests/` is the suite. `archive/` holds code written ahead of the build
# order and parked there (see archive/README.md); its 158 tests import
# modules that are no longer on the engine's import path, so collecting them
# from a bare `pytest` would error rather than fail informatively.
#
# CI runs `pytest tests/` explicitly, so this only governs what happens when
# someone types `pytest` with no path -- which should be the same thing.
testpaths = tests
norecursedirs = archive .git __pycache__
